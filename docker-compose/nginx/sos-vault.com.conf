server {
    listen 80;
    server_name www.sos-vault.com;
    return 301 https://sos-vault.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.sos-vault.com;

    ssl_certificate     /etc/nginx/ssl/sos-vault.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sos-vault.com/privkey.pem;

    return 301 https://sos-vault.com$request_uri;
}

server {
    listen 80;
    server_name sos-vault.com;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/site/public;
    client_max_body_size 512m;
    proxy_request_buffering off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}

server {
    listen 443 ssl;
    server_name sos-vault.com;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/site/public;
    client_max_body_size 512m;
    proxy_request_buffering off;

    ssl_certificate     /etc/nginx/ssl/sos-vault.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sos-vault.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Full HSTS is safe here: sos-vault.com is served behind a CA-issued cert.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Report-Only first: watch the console / report endpoint for violations before
    # promoting to an enforcing Content-Security-Policy. Filament/Livewire/Alpine
    # require 'unsafe-inline' + 'unsafe-eval'.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
