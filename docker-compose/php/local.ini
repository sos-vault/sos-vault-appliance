file_uploads = On
upload_max_filesize=512M
post_max_size=512M
upload_tmp_dir=/tmp

; log_errors
log_errors = On

; gnupg is already enabled by the image (Dockerfile: docker-php-ext-enable
; gnupg -> conf.d/docker-php-ext-gnupg.ini). Re-declaring it here, in another
; conf.d file, made PHP load it twice ("Module gnupg is already loaded").
memory_limit=1024M
max_execution_time=300
max_input_time=300

